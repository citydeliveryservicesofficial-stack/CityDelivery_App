name: city_delivery_services
description: City Delivery Services - mobile app for the City Delivery Services website (Android and iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  google_fonts: ^6.2.1
  lucide_icons_lite: ^1.77.0
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.10+1
  path: ^1.9.0
  flutter_dotenv: ^6.0.2
  flutter_cashfree_pg_sdk: ^2.7.0+55

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFC928"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/gallery/
